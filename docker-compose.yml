version: '3.9'
services:
  db:
    image: postgres:15
    container_name: my_postgres
    restart: always
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    ports:
      - "5050:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - micro-services-net

  user-service:
    build: ./server
    container_name: user-service
    working_dir: /app
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - .env.development
    depends_on:
      - db
    networks:
      - micro-services-net
    command: npm run dev

volumes:
  postgres-data:

networks:
  micro-services-net:
    external: true